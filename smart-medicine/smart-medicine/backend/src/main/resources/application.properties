server.port=${PORT:8080}
server.error.include-message=always
# Database: defaults to a temporary in-memory H2 (data lost on restart). Set DB_URL/DB_USER/DB_PASSWORD for PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:smartmedicine;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://playful-muffin-0c8ff0.netlify.app}
